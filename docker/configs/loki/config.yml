auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# structured metadata (reqId and the other high cardinality fields) requires tsdb and schema v13
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  allow_structured_metadata: true
  # log files are often replayed or backdated here
  reject_old_samples: false
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  max_global_streams_per_user: 10000
  per_stream_rate_limit: 100MB
  per_stream_rate_limit_burst: 100MB
  ingestion_rate_mb: 100
  ingestion_burst_size_mb: 100

# without the compactor the chunks directory grows forever
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
